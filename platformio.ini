; Flow Ctrl — a Wispr Flow push-to-talk / hands-free button on the Cheap Yellow Display
; Board: ESP32-2432S028R. Default env = Drew's USB-C (2-USB) variant.
[platformio]
default_envs = cyd2usb

[env]
platform = espressif32@7.1.3
framework = arduino
board = esp32dev
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  lvgl/lvgl@9.5.0
  bodmer/TFT_eSPI@^2.5.34
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  h2zero/NimBLE-Arduino@^2.2.3
build_flags =
  -I include
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -DLV_USE_TFT_ESPI
  -DUSER_SETUP_LOADED
  -DUSE_HSPI_PORT
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DPANEL_ROTATION=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Original single-micro-USB CYD (ILI9341)
[env:cyd]
build_flags =
  ${env.build_flags}
  -DILI9341_2_DRIVER

; USB-C / 2-USB CYD (ST7789, BGR) — Drew's boards
[env:cyd2usb]
build_flags =
  ${env.build_flags}
  -DST7789_DRIVER
  -DTFT_INVERSION_OFF
  -DTFT_RGB_ORDER=TFT_BGR
