# Flow Ctrl on Omarchy releases that still use hyprland.conf (before the Lua config).
# Installed as ~/.config/hypr/flow-ctrl.conf and sourced from ~/.config/hypr/hyprland.conf.
# https://github.com/WOODWERD/cyd-flow-ctrl

# HOLD TO TALK: Ctrl + Alt + T held for as long as your finger is on the bar
bindd  = CTRL ALT, T, Flow Ctrl: start dictation, exec, flow-ctrl-dictate start
bindrd = CTRL ALT, T, Flow Ctrl: stop dictation, exec, flow-ctrl-dictate stop

# Hands-free toggle, and cancel (Discard while hands-free)
bindd = CTRL ALT, H, Flow Ctrl: hands-free dictation, exec, flow-ctrl-dictate toggle
bindd = CTRL ALT, X, Flow Ctrl: cancel dictation, exec, flow-ctrl-dictate cancel

# Transforms on the selection, rewritten with Claude
bindd = CTRL ALT, 2, Flow Ctrl: Prompt Engineer, exec, flow-ctrl-transform prompt-engineer
bindd = CTRL ALT, 3, Flow Ctrl: Drawing Note, exec, flow-ctrl-transform drawing-note
bindd = CTRL ALT, 4, Flow Ctrl: Client Email, exec, flow-ctrl-transform client-email
