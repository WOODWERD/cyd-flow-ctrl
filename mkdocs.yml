site_name: Flow Ctrl
site_description: A push-to-talk / hands-free button for Wispr Flow on the ESP32 Cheap Yellow Display, with a printed case.
site_url: https://WOODWERD.github.io/cyd-flow-ctrl/
repo_url: https://github.com/WOODWERD/cyd-flow-ctrl
repo_name: cyd-flow-ctrl
edit_uri: edit/main/docs/
copyright: "© 2026 WOODWERD LLC · MIT · Unofficial, not affiliated with Wispr"
docs_dir: docs
theme:
  name: material
  custom_dir: docs-theme/overrides   # WOODWERD/ctrl-docs-theme, checked out at build time
  logo: assets/woodwerd/woodwerd-mark-light.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - assets/woodwerd/woodwerd.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/WOODWERD
      name: WOODWERD on GitHub
    - icon: material/web
      link: https://woodwerd.com
      name: woodwerd.com
nav:
  - Home: index.md
  - Getting started: GETTING_STARTED.md
  - Case & parts: https://github.com/WOODWERD/cyd-case
  - Flash it: flash/index.md
  - Firmware & code: firmware.md
  - Bench test: TESTING.md
  - Changelog: changelog.md
  - Publishing: PUBLISHING.md
  - Notices & license: notices.md
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
plugins:
  - search
